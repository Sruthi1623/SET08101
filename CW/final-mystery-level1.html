<body>
  <div class="coin-bar">🪙 Coins: <span id="coinDisplay">--</span></div>
  <h1>🧩 Level 4: Double Encryption Challenge 🧩</h1>

  <div class="puzzle-container">
    <p>Decrypt this message using Base64 first, then Caesar cipher (shift 3):</p>
    <p><strong>U3F1YWFkIFBhcmsgYXQgTWlkbmlnaHQ=</strong></p>
    <input type="text" id="level4Answer" placeholder="Enter your decrypted answer" />
    <br />

    
<!-- in final-mystery-level1.html, inside your puzzle container -->
<button onclick="checkLevel4Answer()" class="btn">Submit Answer</button>
<button onclick="showLevel1Hint()"          class="hint-btn">💡 Need a Hint?</button>

  </div>

  <script src="Script/coins.js"></script>
  <script src="Script/hint.js"></script>
  <script src="Script/final-mystery-level1.js"></script>
